<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="jDk1s6N-IOBTrNM4PV6WqMvZVyTrDHe8nv0tHPHHvaQ">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Bring your favorite Israeli and international news sources together in one personal, readable feed.">
<title>All News</title>
<script src="theme.js"></script>
<link rel="icon" href="news-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="https://i.imgur.com/y6Zos1q.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="newsroom.css">
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
<symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
<symbol id="icon-feed" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></symbol>
<symbol id="icon-sources" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
<symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1 7M20 4v6h-6"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/></symbol>
</svg>
<a class="skip-link" href="#feed">Skip to headlines</a>
<header class="masthead"><div class="masthead-inner">
<a class="brand" href="./" aria-label="All News home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>all<span class="brand-serif">news</span><span class="brand-period">.</span></span></a>
<button class="icon-button desktop-settings" onclick="openReadingSettings()" aria-label="Reading settings" title="Reading settings"><svg><use href="#icon-settings"/></svg></button>
</div></header>
<main class="page-shell">
<section id="sources-nav" class="source-section" aria-labelledby="sources-title" tabindex="-1">
<h2 id="sources-title" class="visually-hidden">News sources</h2>
<div id="buttons-container" class="source-strip">
<label class="source-chip" data-source="ynet"><input type="checkbox" id="ynet-checkbox" name="ynet" checked><span class="source-monogram source-ynet" aria-hidden="true">y</span><span>Ynet</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="maariv"><input type="checkbox" id="maariv-checkbox" name="maariv" checked><span class="source-monogram source-maariv" aria-hidden="true">מ</span><span>Maariv</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="n12"><input type="checkbox" id="n12-checkbox" name="n12" checked><span class="source-monogram source-n12" aria-hidden="true">12</span><span>N12</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="rotter"><input type="checkbox" id="rotter-checkbox" name="rotter" checked><span class="source-monogram source-rotter" aria-hidden="true">R</span><span>Rotter</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="walla"><input type="checkbox" id="walla-checkbox" name="walla" checked><span class="source-monogram source-walla" aria-hidden="true">w!</span><span>Walla</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="haaretz"><input type="checkbox" id="haaretz-checkbox" name="haaretz" checked><span class="source-monogram source-haaretz" aria-hidden="true">ה</span><span>Haaretz</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="bbc"><input type="checkbox" id="bbc-checkbox" name="bbc"><span class="source-monogram source-bbc" aria-hidden="true">B</span><span>BBC</span><span class="source-check" aria-hidden="true">✓</span></label>
<label class="source-chip" data-source="nyt"><input type="checkbox" id="nyt-checkbox" name="nyt"><span class="source-monogram source-nyt" aria-hidden="true">N</span><span>NY Times</span><span class="source-check" aria-hidden="true">✓</span></label>
</div></section>
<section id="feed" class="feed-section" aria-label="News feed" tabindex="-1">
<h1 id="feed-title" class="visually-hidden">The latest</h1>
<div class="feed-toolbar"><div class="feed-tabs" role="group" aria-label="Choose feed">
<button class="feed-tab active" data-feed-view="all" aria-pressed="true" onclick="setFeedView('all')">Latest</button>
<button class="feed-tab" data-feed-view="saved" aria-pressed="false" onclick="setFeedView('saved')">Saved <span id="saved-count" class="saved-count">0</span></button>
</div><div class="search-field" id="search-container"><svg aria-hidden="true"><use href="#icon-search"/></svg><input type="search" id="search-bar" aria-label="Search headlines" placeholder="Search" autocomplete="off"><button id="search-clear" onclick="clearSearch()" aria-label="Clear search"><svg><use href="#icon-close"/></svg></button><kbd aria-hidden="true">/</kbd></div>
<div class="feed-actions"><div id="mode-switcher" class="segmented-control" role="group" aria-label="Article layout">
<button id="list-mode-btn" class="active" onclick="setDisplayMode('list')" aria-label="List view" aria-pressed="true" title="List view"><svg><use href="#icon-list"/></svg></button>
<button id="card-mode-btn" onclick="setDisplayMode('card')" aria-label="Card view" aria-pressed="false" title="Card view"><svg><use href="#icon-sources"/></svg></button></div>
<button id="refresh-button" class="icon-button" onclick="refreshNews()" aria-label="Refresh news" title="Refresh news"><svg class="refresh-icon"><use href="#icon-refresh"/></svg></button></div></div>
<div class="feed-status"><span id="news-count" aria-live="polite">Loading…</span><p id="last-updated" class="idle" role="status"><span class="status-spinner" aria-hidden="true"></span><span class="status-label">Updating</span></p></div>
<div id="error-container" role="alert"></div>
<div id="news-container" class="news-feed"></div>
<div class="feed-end"><button class="text-button" onclick="scrollToTop()">Back to top ↑</button></div>
</section></main>
<footer class="site-footer"><a href="contact.html">Contact us</a><span aria-hidden="true"> · </span><a href="privacy.html">Privacy policy</a></footer>
<nav class="mobile-dock" aria-label="Quick navigation">
<button class="active" data-feed-view="all" aria-pressed="true" onclick="setFeedView('all'); document.getElementById('feed').scrollIntoView()"><svg><use href="#icon-feed"/></svg><span>Latest</span></button>
<button data-feed-view="saved" aria-pressed="false" onclick="setFeedView('saved'); document.getElementById('feed').scrollIntoView()"><svg><use href="#icon-bookmark"/></svg><span>Saved</span></button>
<button onclick="scrollToSources()"><svg><use href="#icon-sources"/></svg><span>Sources</span></button>
<button onclick="openReadingSettings()"><svg><use href="#icon-settings"/></svg><span>Reading</span></button>
</nav>
<button id="scroll-to-top" class="icon-button" onclick="scrollToTop()" aria-label="Back to top">↑</button>
<p id="reading-feedback" class="visually-hidden" role="status" aria-live="polite"></p>
<dialog id="reading-settings" aria-labelledby="settings-title">
<div class="dialog-heading"><h2 id="settings-title">Reading</h2><button class="icon-button" onclick="closeReadingSettings()" aria-label="Close reading settings"><svg><use href="#icon-close"/></svg></button></div>
<div class="setting-row"><label for="theme-select">Appearance</label><select id="theme-select"><option value="system">Device theme</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<div class="setting-row"><h3>Text size</h3><div class="font-controls"><button id="decrease-font" onclick="adjustFontSize(-1)" aria-label="Decrease text size">A−</button><output id="font-size-value">18</output><button id="increase-font" onclick="adjustFontSize(1)" aria-label="Increase text size">A+</button></div></div>
<div class="setting-row"><div><h3>Auto-refresh</h3><p>Every 30 seconds</p></div><button id="auto-refresh-toggle" class="auto-refresh-off" onclick="toggleAutoRefresh()" aria-pressed="false" aria-label="Automatic updates"><span class="toggle-track" aria-hidden="true"></span><span id="auto-refresh-label">Off</span></button></div>
<p class="settings-note">Preferences are saved on this device.</p>
<nav class="settings-links" aria-label="App information"><a href="contact.html">Contact us</a><a href="privacy.html">Privacy policy</a></nav>
<button class="primary-button" onclick="closeReadingSettings()">Done</button>
</dialog>
<script src="scripts.js"></script>
</body>
</html>
